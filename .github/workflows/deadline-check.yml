name: Deadline check

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous page state
        uses: actions/cache/restore@v4
        with:
          path: .cache/deadline-page-state.json
          key: deadline-page-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deadline-page-state-

      - name: Scan conference pages
        id: scan
        run: >-
          python scripts/check_deadlines.py
          --data data/conferences.json
          --state .cache/deadline-page-state.json
          --report deadline-report.md

      - name: Save current page state
        if: always() && hashFiles('.cache/deadline-page-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/deadline-page-state.json
          key: deadline-page-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Add report to workflow summary
        if: always()
        run: cat deadline-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update review issue
        if: steps.scan.outputs.has_notifications == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deadline-review \
            --description "Conference deadline findings requiring human review" \
            --color "0E8A16" \
            --force

          issue_number="$(gh issue list \
            --state open \
            --label deadline-review \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$issue_number" ]; then
            issue_number="$(gh issue list \
              --state open \
              --search '"Conference deadline check" in:title' \
              --json number \
              --jq '.[0].number // empty')"
          fi

          title="Conference deadline review $(date -u +%Y-%m-%d)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --title "$title" \
              --body-file deadline-report.md \
              --add-label deadline-review
          else
            gh issue create \
              --title "$title" \
              --body-file deadline-report.md \
              --label deadline-review
          fi
